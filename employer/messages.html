    <title>Tin nhắn — JobViệt</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />
    <link rel="stylesheet" href="../css/pages/messages.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <div class="layout-sidebar">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content-area">
        <div class="messages-layout animate-fade-up">
          <!-- Sidebar: Conversations -->
          <div class="conversations-sidebar">
            <div class="conv-header">Tin nhắn</div>
            <div class="conv-list" id="convList">
              <!-- Rendered by JS -->
            </div>
          </div>

          <!-- Main Chat Area -->
          <div class="chat-main" id="chatMain">
            <div class="empty-state" style="margin: auto">
              <div class="empty-icon"><i class="fa-solid fa-comments"></i></div>
              <h3>Chọn một cuộc hội thoại</h3>
              <p>Bắt đầu trao đổi với ứng viên của bạn.</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      const user = window.Auth.requireAuth(["employer"]);
      if (!user) throw "redirect";
      window.App.renderSidebar("employer", "messages");

      let activeContactId = new URLSearchParams(location.search).get("to");
      const conversationContacts = new Map();
      let olderMessageCursor = null;
      let hasOlderMessages = false;
      let loadingOlderMessages = false;

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[char]);
      }

      function renderMessage(m) {
        const time = new Date(m.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        return `<div class="msg ${m.senderId === user.id ? "msg-sent" : "msg-received"}" data-message-id="${m.id}">${escapeHtml(m.content)}<span class="msg-time">${time}</span></div>`;
      }

      window.loadOlderMessages = async function() {
        if (!activeContactId || !olderMessageCursor || !hasOlderMessages || loadingOlderMessages) return;
        const list = document.getElementById("msgList");
        const button = document.getElementById("loadOlderMessages");
        if (!list || !button) return;
        loadingOlderMessages = true;
        button.disabled = true;
        const oldHeight = list.scrollHeight;
        const oldTop = list.scrollTop;
        try {
          const page = await window.DB.getMessages(user.id, activeContactId, olderMessageCursor);
          olderMessageCursor = page.nextCursor;
          hasOlderMessages = page.hasMore;
          button.insertAdjacentHTML("afterend", page.messages.map(renderMessage).join(""));
          button.hidden = !hasOlderMessages;
          list.scrollTop = oldTop + (list.scrollHeight - oldHeight);
        } finally {
          loadingOlderMessages = false;
          if (button.isConnected) button.disabled = false;
        }
      };

      async function renderConversations() {
        const conversations = await window.DB.getConversations(user.id);
        const list = document.getElementById("convList");
        conversationContacts.clear();
        for (const conversation of conversations) {
          if (conversation.contact) conversationContacts.set(String(conversation.contact.id), conversation.contact);
        }

        if (!conversations.length) {
          list.innerHTML =
            '<p class="text-center" style="padding:20px; color:var(--text-light); font-size:0.9rem">Chưa có hội thoại nào.</p>';
          return;
        }

        list.innerHTML = conversations
          .map((c) => {
            const initials = (c.contact?.fullName || "??")
              .split(" ")
              .map((n) => n[0])
              .join("")
              .slice(0, 2);
            const isActive = String(c.contact?.id) === activeContactId;
            return `
            <div class="conv-item ${isActive ? "active" : ""}" onclick="selectContact('${c.contact?.id}')">
              <div class="conv-avatar">${initials}</div>
              <div class="conv-info">
                <div class="conv-name">${escapeHtml(c.contact?.fullName || "Ứng viên")}</div>
                <div class="conv-last-msg">${escapeHtml(c.lastMessage ? (c.lastMessage.senderId === user.id ? "Bạn: " : "") + c.lastMessage.content : "Bắt đầu trò chuyện")}</div>
              </div>
              ${c.unreadCount > 0 ? `<div class="conv-unread">${c.unreadCount}</div>` : ""}
            </div>
          `;
          })
          .join("");
      }

      window.selectContact = async function(contactId) {
        activeContactId = contactId;
        const newUrl = window.location.pathname + "?to=" + contactId;
        window.history.pushState({ path: newUrl }, "", newUrl);

        await renderConversations();
        await renderChat();
        await window.DB.markAsRead(user.id, contactId);
      }

      async function renderChat() {
        if (!activeContactId) return;

        const contact = conversationContacts.get(String(activeContactId)) || await window.DB.getUserById(activeContactId);
        if (!contact) return;

        const page = await window.DB.getMessages(user.id, activeContactId);
        olderMessageCursor = page.nextCursor;
        hasOlderMessages = page.hasMore;
        const initials = contact.fullName
          .split(" ")
          .map((n) => n[0])
          .join("")
          .slice(0, 2);

        const chatMain = document.getElementById("chatMain");
        chatMain.innerHTML = `
          <div class="chat-header">
            <div class="conv-avatar" style="width:40px; height:40px">${initials}</div>
            <div class="conv-name">${escapeHtml(contact.fullName)}</div>
          </div>
          <div class="chat-messages" id="msgList">
            ${hasOlderMessages ? '<button type="button" id="loadOlderMessages" onclick="loadOlderMessages()">Tải tin nhắn cũ hơn</button>' : ""}
            ${page.messages.map(renderMessage).join("")}
          </div>
          <form class="chat-input-area" onsubmit="handleSend(event)">
            <input type="text" class="chat-input" id="chatInput" maxlength="2000" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button type="submit" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
        `;

        const msgList = document.getElementById("msgList");
        if (msgList) msgList.scrollTop = msgList.scrollHeight;
      }

      window.handleSend = async function(e) {
        e.preventDefault();
        const input = document.getElementById("chatInput");
        const content = input.value.trim();
        if (!content || !activeContactId) return;

        await window.DB.sendMessage(user.id, activeContactId, content);
        input.value = "";
        await renderChat();
        await renderConversations();
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await renderConversations();
        if (activeContactId) {
          await renderChat();
          await window.DB.markAsRead(user.id, activeContactId);
        }
      });

      // Auto refresh
      setInterval(async () => {
        await renderConversations();
        if (activeContactId) {
          const list = document.getElementById("msgList");
          if (!list) return;
          const page = await window.DB.getMessages(user.id, activeContactId);
          const lastRenderedId = list.querySelector(".msg:last-child")?.dataset.messageId;
          const latestId = page.messages.at(-1)?.id;
          if (latestId && String(latestId) !== lastRenderedId) {
            await renderChat();
          }
        }
      }, 5000);
    </script>
  </body>
</html>

    <title>Đăng tuyển — JobViệt</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />
    <link rel="stylesheet" href="../css/pages/employer.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <div class="layout-sidebar">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content-area">
        <div class="content-header">
          <h1><i class="fa-solid fa-pen-to-square"></i> Đăng tin tuyển dụng</h1>
          <p>Tạo tin tuyển dụng mới để thu hút ứng viên</p>
        </div>
        <div class="card card-employer-form">
          <form onsubmit="postJob(event)">
            <section class="job-form-section">
              <h2><i class="fa-solid fa-clipboard-list"></i> Tổng quan</h2>
              <div class="form-group">
                <label class="form-label" for="title">Tiêu đề công việc *</label>
                <input class="form-input" id="title" required placeholder="VD: Lập trình viên Frontend React" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="category">Danh mục *</label>
                  <select class="form-select" id="category" required>
                    <option>Công nghệ</option><option>Marketing</option><option>Thiết kế</option>
                    <option>Kinh doanh</option><option>Hành chính</option><option>Tài chính</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="experience">Kinh nghiệm *</label>
                  <select class="form-select" id="experience" required>
                    <option value="0-1 năm">0-1 năm</option><option value="1-3 năm">1-3 năm</option>
                    <option value="2-5 năm">2-5 năm</option><option value="5+ năm">5+ năm</option>
                  </select>
                </div>
              </div>
            </section>
            <section class="job-form-section">
              <h2><i class="fa-solid fa-align-left"></i> Mô tả công việc</h2>
              <div class="form-group">
                <label class="form-label" for="description">Mô tả công việc *</label>
                <textarea class="form-textarea" id="description" required placeholder="Mô tả trách nhiệm và công việc hằng ngày..."></textarea>
              </div>
            </section>
            <section class="job-form-section">
              <h2><i class="fa-solid fa-user-check"></i> Yêu cầu ứng viên</h2>
              <div class="form-group">
                <label class="form-label" for="requirements">Yêu cầu ứng viên *</label>
                <textarea class="form-textarea" id="requirements" required placeholder="Kinh nghiệm, kỹ năng và điều kiện ứng tuyển..."></textarea>
              </div>
            </section>
            <section class="job-form-section">
              <h2><i class="fa-solid fa-money-bill-wave"></i> Thu nhập</h2>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="salaryMin">Lương tối thiểu (triệu VND/tháng) *</label>
                  <input class="form-input" id="salaryMin" type="number" min="0.1" max="1000000" step="0.1" required placeholder="VD: 20" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="salaryMax">Lương tối đa (triệu VND/tháng) *</label>
                  <input class="form-input" id="salaryMax" type="number" min="0.1" max="1000000" step="0.1" required placeholder="VD: 35" />
                </div>
              </div>
            </section>
            <section class="job-form-section">
              <h2><i class="fa-solid fa-gift"></i> Quyền lợi ứng viên</h2>
              <div class="form-group">
                <label class="form-label" for="benefits">Quyền lợi</label>
                <textarea class="form-textarea" id="benefits" placeholder="Phúc lợi, chế độ và cơ hội phát triển..."></textarea>
              </div>
            </section>
            <section class="job-form-section">
              <h2><i class="fa-solid fa-location-dot"></i> Địa điểm và thời gian</h2>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="location">Địa điểm làm việc *</label>
                  <input class="form-input" id="location" required placeholder="VD: Hà Nội" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="type">Hình thức làm việc *</label>
                  <select class="form-select" id="type" required>
                    <option value="full-time">Toàn thời gian</option><option value="part-time">Bán thời gian</option>
                  </select>
                </div>
              </div>
            </section>
            <section class="job-form-section">
              <h2><i class="fa-solid fa-calendar-days"></i> Thời hạn ứng tuyển</h2>
              <div class="form-group">
                <label class="form-label" for="expiresAt">Nhận hồ sơ đến *</label>
                <input class="form-input" type="datetime-local" id="expiresAt" required />
                <p class="form-hint">Sau thời điểm này, tin sẽ không còn xuất hiện trong danh sách việc làm và không nhận hồ sơ mới.</p>
              </div>
            </section>
            <button
              type="submit"
              class="btn btn-primary btn-large btn-full mt-2"
            >
              <i class="fa-solid fa-rocket"></i> Đăng tuyển
            </button>
          </form>
        </div>
      </main>
    </div>
    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      document.addEventListener("DOMContentLoaded", () => {
        const user = window.Auth.requireAuth(["employer"]);
        if (!user) return;
        window.App.renderSidebar("employer", "post");
        const deadlineInput = document.getElementById("expiresAt");
        const localNow = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        deadlineInput.min = localNow;

        window.postJob = async function(e) {
          e.preventDefault();
          // Nút bấm sẽ đổi trạng thái khi đang lưu
          const btn = e.target.querySelector('button[type="submit"]');
          const originalText = btn.innerHTML;
          btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang đăng tin...';
          btn.disabled = true;

          try {
            await window.DB.createJob({
              title: document.getElementById("title").value.trim(),
              salaryMin: Math.round(Number(document.getElementById("salaryMin").value) * 1000000),
              salaryMax: Math.round(Number(document.getElementById("salaryMax").value) * 1000000),
              location: document.getElementById("location").value.trim(),
              type: document.getElementById("type").value,
              experience: document.getElementById("experience").value,
              category: document.getElementById("category").value,
              description: document.getElementById("description").value.trim(),
              requirements: document.getElementById("requirements").value.trim(),
              benefits: document.getElementById("benefits").value.trim(),
              expiresAt: new Date(document.getElementById("expiresAt").value).toISOString(),
            });

            Toast.success("🎉 Đăng tin tuyển dụng thành công!");
            setTimeout(() => {
              location.href = "my-jobs.html";
            }, 1000);
          } catch (error) {
            Toast.error("Đã có lỗi xảy ra: " + error.message);
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        };
      });
    </script>
  </body>

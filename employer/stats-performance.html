    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />

      rel="stylesheet"

    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <div class="layout-sidebar">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content-area">
        <div class="content-header">
          <h1><i class="fa-solid fa-chart-column"></i> Hiệu quả tuyển dụng</h1>
          <p>Đánh giá phễu tuyển dụng và chất lượng ứng viên</p>
        </div>

        <div class="grid grid-3 stagger" id="funnelStats">
          <div class="stat-card">
            <div class="stat-icon blue">
              <i class="fa-solid fa-envelope-open-text"></i>
            </div>
            <div class="stat-value" id="s_applied">0</div>
            <div class="stat-label">Hồ sơ tiếp nhận</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon orange">
              <i class="fa-solid fa-calendar-days"></i>
            </div>
            <div class="stat-value" id="s_interview">0</div>
            <div class="stat-label">Phỏng vấn</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">
              <i class="fa-solid fa-circle-check"></i>
            </div>
            <div class="stat-value" id="s_hired">0</div>
            <div class="stat-label">Trúng tuyển</div>
          </div>
        </div>

      </main>
    </div>
    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      const user = window.Auth.requireAuth(["employer"]);
      if (!user) throw "redirect";
      window.App.renderSidebar("employer", "stats_performance");

      const myJobs = await DB.getJobsByEmployer(user.id);
      const appGroups = await Promise.all(myJobs.map((job) => DB.getApplicationsByJob(job.id)));
      const allApps = appGroups.flat();

      document.getElementById("s_applied").textContent = allApps.length;
      document.getElementById("s_interview").textContent = allApps.filter((app) => ["interview_invited", "interviewed"].includes(app.status)).length;
      document.getElementById("s_hired").textContent = allApps.filter(
        (a) => ["hired", "accepted"].includes(a.status),
      ).length;
    </script>
  </body>

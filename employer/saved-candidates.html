    <title>Ứng viên đã lưu — JobViệt</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <div class="layout-sidebar">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content-area">
        <div class="content-header">
          <h1><i class="fa-solid fa-thumbtack"></i> Ứng viên đã lưu</h1>
          <p>Những hồ sơ tiềm năng bạn đã đánh dấu để xem xét sau</p>
        </div>

        <div class="grid grid-3 stagger" id="savedCandidates">
          <!-- Rendered by JS -->
        </div>
      </main>
    </div>
    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      const user = window.Auth.requireAuth(["employer"]);
      if (!user) throw "redirect";
      window.App.renderSidebar("employer", "saved_candidates");
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      window.removeSaved = async (id) => {
        if (!confirm("Bỏ lưu ứng viên này?")) return;
        try { await window.DB.unsaveCandidate(id); Toast.success("Đã bỏ lưu ứng viên."); await render(); }
        catch (error) { Toast.error(error.message || "Không bỏ lưu được ứng viên."); }
      };
      async function render() {
        const container = document.getElementById("savedCandidates");
        container.innerHTML = '<p class="text-center">Đang tải danh sách...</p>';
        try {
          const savedList = await window.DB.getSavedCandidates();
          if (!savedList.length) {
            container.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon"><i class="fa-solid fa-thumbtack"></i></div><p>Chưa có hồ sơ nào được lưu</p></div>';
            return;
          }
          container.innerHTML = savedList.map((candidate) => `
            <article class="card animate-fade-up" id="card-${candidate.id}">
              <div class="flex" style="gap:16px;margin-bottom:16px">
                <div class="avatar" style="width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:white;background:var(--primary)">${escapeHtml((candidate.fullName || "U").slice(0,1))}</div>
                <div><h3>${window.App.profileLink("candidate", candidate.id, candidate.fullName || "Ứng viên")}</h3><p style="color:var(--text-light)">${escapeHtml(candidate.title || "Ứng viên")}</p></div>
              </div>
              <div style="font-size:.9rem;color:var(--text-light);margin-bottom:20px">Đã lưu: ${window.App.formatDate(candidate.savedAt)}<br>Kinh nghiệm: ${escapeHtml(candidate.experience || "Chưa cập nhật")}<br>Địa điểm: ${escapeHtml(candidate.location || "Chưa cập nhật")}</div>
              <div class="flex-between"><button class="btn btn-sm btn-danger" onclick="removeSaved('${candidate.id}')">Bỏ lưu</button><a class="btn btn-sm btn-primary" href="candidate-profile.html?id=${encodeURIComponent(candidate.id)}">Xem hồ sơ</a></div>
            </article>`).join("");
        } catch (error) {
          console.error(error);
          container.innerHTML = `<p class="text-center text-danger">${escapeHtml(error.message || "Không tải được danh sách ứng viên đã lưu.")}</p>`;
        }
      }
      render();
    </script>
  </body>
</html>

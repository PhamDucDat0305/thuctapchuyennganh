  <body class="company-profile-page">
    <div id="navbar-placeholder"></div>
    <div class="layout-sidebar">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content-area">
        <div class="content-header">
          <h1>
            <i class="fa-solid fa-pen-to-square"></i> Sửa thông tin công ty
          </h1>
        </div>
        <div class="card card-employer-form">
          <form onsubmit="window.saveCompany(event)" id="companyEditForm">
            <div class="form-group">
              <label class="form-label" for="name">Tên công ty *</label
              ><input class="form-input" id="name" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="logoFile">Logo công ty</label>
              <div class="company-logo-upload">
                <div class="company-logo-upload-preview" id="logoPreview"><i class="fa-regular fa-image"></i></div>
                <div><input class="form-input" id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" />
                  <p class="form-hint">PNG, JPG hoặc WEBP; dung lượng tối đa 2MB.</p></div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="industry">Ngành nghề</label
                ><input
                  class="form-input"
                  id="industry"
                  placeholder="Công nghệ thông tin"
                />
              </div>
              <div class="form-group">
                <label class="form-label" for="size">Quy mô</label
                ><input class="form-input" id="size" placeholder="100-500" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="location">Địa điểm</label
                ><input class="form-input" id="location" />
              </div>
              <div class="form-group">
                <label class="form-label" for="website">Website</label
                ><input
                  class="form-input"
                  id="website"
                  type="url"
                  placeholder="https://congty.vn"
                />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="description">Mô tả công ty</label
              ><textarea class="form-textarea" id="description"></textarea>
            </div>
            <div class="flex" style="gap: 12px">
              <button type="submit" class="btn btn-primary btn-large">
                <i class="fa-solid fa-floppy-disk"></i> Lưu</button
              ><a
                href="company-profile.html"
                class="btn btn-secondary btn-large"
                >Hủy</a
              >
            </div>
          </form>
        </div>
      </main>
    </div>
    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      document.addEventListener("DOMContentLoaded", async () => {
        const user = window.Auth.requireAuth(["employer"]);
        if (!user) return;
        window.App.renderSidebar("employer", "edit_company");
        let existingCompany = null;
        const fileInput = document.getElementById("logoFile");
        const preview = document.getElementById("logoPreview");
        let previewObjectUrl = null;

        fileInput.addEventListener("change", () => {
          const file = fileInput.files?.[0];
          if (!file) return;
          if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type) || file.size > 2 * 1024 * 1024) {
            fileInput.value = "";
            Toast.error("Chọn ảnh PNG, JPG hoặc WEBP có dung lượng tối đa 2MB.");
            return;
          }
          if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
          previewObjectUrl = URL.createObjectURL(file);
          preview.innerHTML = `<img src="${previewObjectUrl}" alt="Xem trước logo">`;
        });

        window.saveCompany = async function(e) {
          e.preventDefault();
          const btn = e.target.querySelector('button[type="submit"]');
          btn.disabled = true;
          btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...';

          try {
            const website = document.getElementById("website").value.trim();
            if (website) {
              const parsedWebsite = new URL(website);
              if (!['http:', 'https:'].includes(parsedWebsite.protocol)) throw new Error("Website phải là địa chỉ HTTP hoặc HTTPS hợp lệ.");
            }
            const selectedLogo = fileInput.files?.[0];
            if (selectedLogo && (!['image/png', 'image/jpeg', 'image/webp'].includes(selectedLogo.type) || selectedLogo.size > 2 * 1024 * 1024)) {
              throw new Error("Logo phải là PNG, JPG hoặc WEBP và tối đa 2MB.");
            }
            let logo = existingCompany?.logo || "";
            let logoUrl = existingCompany?.logoUrl || "";
            if (selectedLogo) {
              logoUrl = await window.DB.uploadCompanyLogo(selectedLogo);
              logo = logoUrl;
            }
            const data = {
              name: document.getElementById("name").value.trim(),
              logo,
              logoUrl,
              industry: document.getElementById("industry").value.trim(),
              size: document.getElementById("size").value.trim(),
              location: document.getElementById("location").value.trim(),
              website,
              description: document.getElementById("description").value.trim(),
            };

            const existing = await window.DB.getCompanyByEmployer(user.id);
            if (existing) {
              await window.DB.updateCompany(user.id, data);
            } else {
              await window.DB.createCompany(user.id, data);
            }
            
            Toast.success("Cập nhật thành công!");
            setTimeout(() => (location.href = "company-profile.html"), 800);
          } catch (error) {
            Toast.error("Lỗi: " + error.message);
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Lưu';
          }
        };

        try {
          const c = (await window.DB.getCompanyByEmployer(user.id)) || {};
          existingCompany = c;
          document.getElementById("name").value = c.name || "";
          document.getElementById("industry").value = c.industry || "";
          document.getElementById("size").value = c.size || "";
          document.getElementById("location").value = c.location || "";
          document.getElementById("website").value = c.website || "";
          document.getElementById("description").value = c.description || "";
          const image = c.logoUrl || c.logo;
          if (image && (/^https?:\/\//i.test(image) || /^\/employer\/uploads\/companies\//.test(image))) {
            const safeImage = String(image).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
            preview.innerHTML = `<img src="${safeImage}" alt="Logo công ty">`;
          } else {
            const initial = String(c.name || "C").trim().charAt(0).toUpperCase().replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
            preview.innerHTML = `<span>${initial}</span>`;
          }
          if (location.hash) requestAnimationFrame(() => document.getElementById(location.hash.slice(1))?.focus());
        } catch (error) {
          console.error("Không tải được hồ sơ công ty:", error);
          Toast.error("Không tải được hồ sơ công ty: " + error.message);
        }
      });
    </script>

    <title>Thông tin tài khoản — JobViệt</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />
    <link rel="stylesheet" href="../css/pages/employer.css" />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <div class="layout-sidebar">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content-area">
        <div class="content-header">
          <h1><i class="fa-solid fa-user"></i> Thông tin cá nhân</h1>
          <p>Quản lý thông tin tài khoản đăng nhập</p>
        </div>

        <div class="card animate-fade-up" style="max-width: 600px">
          <form onsubmit="updateAccount(event)">
            <div
              class="flex flex-mobile-column"
              style="
                gap: 20px;
                margin-bottom: 24px;
                padding-bottom: 24px;
                border-bottom: 1px solid var(--border-light);
              "
            >
              <div
                id="avatarPreview"
                style="
                  width: 80px;
                  height: 80px;
                  border-radius: 50%;
                  background: linear-gradient(135deg, var(--primary), #38bdf8);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: white;
                  font-size: 2rem;
                  font-weight: bold;
                  flex-shrink: 0;
                "
              >
                U
              </div>
              <div>
                <h3 style="margin-bottom: 8px" id="displayName">Người dùng</h3>
                <p style="color: var(--text-light); font-size: 0.9rem">
                  Ảnh đại diện được tạo tự động từ tên của bạn.
                </p>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Họ và tên</label>
              <input class="form-input" id="fullName" required />
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input class="form-input" type="email" id="email" required />
            </div>
            <div class="form-group">
              <label class="form-label">Tên đăng nhập (Username)</label>
              <input
                class="form-input"
                id="username"
                disabled
                style="background: #f1f5f9; cursor: not-allowed"
              />
              <small
                style="
                  color: var(--text-light);
                  display: block;
                  margin-top: 4px;
                "
                >Không thể thay đổi tên đăng nhập</small
              >
            </div>
            <div class="form-group" style="margin-top: 24px">
              <button type="submit" class="btn btn-primary btn-large w-100">
                <i class="fa-solid fa-floppy-disk"></i> Cập nhật thông tin
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      const user = window.Auth.requireAuth(["employer"]);
      if (!user) throw "redirect";
      window.App.renderSidebar("employer", "account");

      // Điền thông tin cũ
      document.getElementById("fullName").value = user.fullName;
      document.getElementById("email").value = user.email || "";
      document.getElementById("username").value = user.username;
      document.getElementById("displayName").textContent = user.fullName;
      document.getElementById("avatarPreview").textContent =
        user.fullName[0].toUpperCase();

      async function updateAccount(e) {
        e.preventDefault();
        const newName = document.getElementById("fullName").value.trim();
        const newEmail = document.getElementById("email").value.trim();

        try {
          const updates = { 
            fullName: newName, 
            email: newEmail 
          };
          
          await window.DB.updateUser(user.id, updates);
          
          // Update local session
          window.Auth.updateSession(updates);

          Toast.success("Cập nhật thông tin thành công!");
          setTimeout(() => location.reload(), 1000);
        } catch (error) {
          console.error(error);
          Toast.error("Lỗi: " + error.message);
        }
      }
      
      window.updateAccount = updateAccount;
    </script>
  </body>
</html>

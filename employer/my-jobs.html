    <title>Job đã đăng — JobViệt</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <div class="layout-sidebar">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content-area">
        <div class="content-header flex-between">
          <div>
            <h1>
              <i class="fa-solid fa-rectangle-list"></i> Tin tuyển dụng đã đăng
            </h1>
            <p>Quản lý các tin tuyển dụng của bạn</p>
          </div>
          <a href="post-job.html" class="btn btn-primary">+ Đăng tin mới</a>
        </div>
        <div id="jobList"></div>
      </main>
    </div>
    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      document.addEventListener("DOMContentLoaded", () => {
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[char]);
        const user = window.Auth.requireAuth(["employer"]);
        if (!user) return;
        window.App.renderSidebar("employer", "myjobs");

        window.render = async function() {
          const listContainer = document.getElementById("jobList");
          listContainer.innerHTML = '<div style="text-align:center; padding: 20px;">Đang tải danh sách...</div>';

          try {
          const jobs = await window.DB.getJobsByEmployer(user.id);
          if (!jobs.length) {
            listContainer.innerHTML =
              '<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-file-lines"></i></div><h3>Chưa đăng tin nào</h3><a href="post-job.html" class="btn btn-primary mt-2">Đăng tin ngay</a></div>';
            return;
          }

          const rows = [];
          for (const j of jobs) {
            const apps = await window.DB.getApplicationsByJob(j.id);
            const appCount = apps.length;
            rows.push(`<tr>
              <td data-label="Tiêu đề"><strong>${escapeHtml(j.title)}</strong><br><span class="badge badge-neutral" style="margin-top:4px">${escapeHtml(j.type)}</span> <span class="badge ${j.status === 'active' ? 'badge-primary' : 'badge-neutral'}">${escapeHtml(j.status)}</span></td>
              <td data-label="Lương">${escapeHtml(j.salary)}</td>
              <td data-label="Địa điểm">${escapeHtml(j.location)}</td>
              <td data-label="Ứng viên"><a href="job-applicants.html?id=${j.id}" class="badge badge-info" style="cursor:pointer">${appCount} CV</a></td>
              <td data-label="Lượt xem"><i class="fa-solid fa-eye"></i> ${j.views || 0}</td>
              <td data-label="Ngày đăng">${window.App.formatDate(j.createdAt)}</td>
              <td data-label="Thao tác"><div class="flex" style="gap:6px">
                <a href="edit-job.html?id=${j.id}" class="btn btn-sm btn-secondary"><i class="fa-solid fa-pen-to-square"></i></a>
                <a href="job-applicants.html?id=${j.id}" class="btn btn-sm btn-primary"><i class="fa-solid fa-users"></i></a>
                ${j.status === 'active' ? `<button class="btn btn-sm btn-danger" onclick="deleteJob('${j.id}')" title="Đóng tin"><i class="fa-solid fa-ban"></i></button>` : '<span>Đã đóng</span>'}
              </div></td>
            </tr>`);
          }

          listContainer.innerHTML =
            `<div class="table-wrapper"><table class="table">
          <thead><tr><th>Tiêu đề</th><th>Lương</th><th>Địa điểm</th><th>Ứng viên</th><th>Lượt xem</th><th>Ngày đăng</th><th>Thao tác</th></tr></thead>
          <tbody>${rows.join("")}</tbody>
        </table></div>`;
          } catch (error) {
            listContainer.innerHTML = `<div class="empty-state"><h3>Không tải được danh sách tin</h3><p>${escapeHtml(error.message)}</p></div>`;
          }
        };

        window.deleteJob = async function(id) {
          if (!confirm("Đóng tin tuyển dụng này? Tin sẽ không còn hiển thị công khai.")) return;
          try {
            await window.DB.deleteJob(id);
            Toast.success("Đã đóng tin tuyển dụng");
            window.render();
          } catch (error) {
            Toast.error("Không thể đóng tin: " + error.message);
          }
        };

        window.render();
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lab Thực Hành — JobViệt. Trang thực hành và thử nghiệm tính năng hệ thống tuyển dụng." />
    <link rel="icon" type="image/png" sizes="32x32" href="./ico/favicon-32x32.png" />
    <link rel="manifest" href="./ico/manifest.json" />
    <title>Lab Thực Hành — JobViệt</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/pages/static.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <div id="navbar-placeholder"></div>
      <section class="hero" style="padding: 60px 0">
        <div class="container hero-content text-center">
          <h1 class="animate-fade-up">
            <i class="fa-solid fa-flask"></i> Lab Thực Hành
          </h1>
          <p class="animate-fade-up" style="animation-delay: 0.1s; margin: 0 auto">
            Trang thực hành và kiểm thử tính năng hệ thống
          </p>
        </div>
      </section>
      <section class="main-content">
        <div class="container">
          <div class="card animate-fade-up" style="padding: 40px; text-align: center; margin: 40px auto; max-width: 600px">
            <div style="font-size: 4rem; margin-bottom: 20px; color: var(--primary)">
              <i class="fa-solid fa-flask-vial"></i>
            </div>
            <h2>🔬 Môi trường Thử nghiệm</h2>
            <p style="color: var(--text-light); margin: 16px 0; line-height: 1.7">
              Trang này được sử dụng cho mục đích thực hành và kiểm thử các tính năng của hệ thống JobViệt.
              Các tính năng ở đây có thể đang trong quá trình phát triển.
            </p>
            <div class="grid grid-2" style="gap: 16px; margin-top: 24px">
              <a href="index.html" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Về Trang chủ
              </a>
              <a href="job-list.html" class="btn btn-outline">
                <i class="fa-solid fa-briefcase"></i> Xem Việc làm
              </a>
            </div>
          </div>
        </div>
      </section>
      <footer class="footer" id="footer"></footer>
    </div>
    <script type="module" src="js/db.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script type="module" src="js/app.js"></script>
    <script src="js/navbar.js"></script>
  </body>
</html>

    <title>Chi tiết công việc — JobViệt</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/pages/job-detail.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body class="job-detail-page">
    <div id="navbar-placeholder"></div>

    <div class="detail-container">
      <div id="jobDetail">
        <div class="text-center" style="padding: 100px 0">
          <i
            class="fa-solid fa-circle-notch fa-spin"
            style="font-size: 3rem; color: var(--primary)"
          ></i>
          <p style="margin-top: 16px; color: var(--text-light)">
            Đang tải thông tin công việc...
          </p>
        </div>
      </div>
    </div>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="js/db.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script type="module" src="js/app.js"></script>
    <script src="js/navbar.js"></script>
    <script type="module">
      document.addEventListener("DOMContentLoaded", async () => {
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[char]);
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get("id");

        if (!jobId) {
          window.location.href = "index.html";
          return;
        }

        const job = await window.DB.getJobById(jobId);
        if (!job) {
          document.getElementById("jobDetail").innerHTML = `
          <div class="card text-center" style="padding: 60px;">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; color: var(--danger); margin-bottom: 16px;"></i>
            <h2>Không tìm thấy công việc</h2>
            <p style="color: var(--text-light); margin-bottom: 24px;">Công việc bạn đang tìm kiếm không tồn tại hoặc đã bị xóa.</p>
            <a href="index.html" class="btn btn-primary">Quay lại trang chủ</a>
          </div>
        `;
          return;
        }

        // Tăng lượt xem (chỉ tăng nếu người xem không phải chủ sở hữu tin)
        const currentUser = window.Auth.getCurrentUser();
        if (!currentUser || currentUser.id !== job.createdBy) {
          await window.DB.incrementJobViews(jobId);
        }

        document.title = `${job.title} — JobViệt`;

        const salary = job.salaryMin != null && job.salaryMax != null
          ? `${(Number(job.salaryMin) / 1000000).toLocaleString("vi-VN")} - ${(Number(job.salaryMax) / 1000000).toLocaleString("vi-VN")} triệu VND/tháng`
          : (job.salary || "Thỏa thuận");
        const deadline = job.expiresAt
          ? new Date(job.expiresAt).toLocaleDateString("vi-VN")
          : "Theo thông báo của nhà tuyển dụng";
        const companyLink = window.App.profileLink("company", job.companyId, job.companyName);
        document.getElementById("jobDetail").innerHTML = `
        <section class="detail-card detail-hero animate-fade-up">
          <h1 class="detail-job-title">${escapeHtml(job.title)}</h1>
          <div class="detail-salary">${escapeHtml(salary)}</div>
          <div class="detail-company">${companyLink}</div>
          <div class="detail-facts">
            <div class="detail-fact"><span class="detail-fact-icon"><i class="fa-solid fa-location-dot"></i></span><span><small>Địa điểm</small><strong>${escapeHtml(job.location || "Chưa cập nhật")}</strong></span></div>
            <div class="detail-fact"><span class="detail-fact-icon"><i class="fa-solid fa-briefcase"></i></span><span><small>Kinh nghiệm</small><strong>${escapeHtml(job.experience || "Không yêu cầu")}</strong></span></div>
            <div class="detail-fact"><span class="detail-fact-icon"><i class="fa-regular fa-calendar"></i></span><span><small>Hạn ứng tuyển</small><strong>${escapeHtml(deadline)}</strong></span></div>
          </div>
          ${currentUser?.role === "employer" ? "" : `<div class="detail-actions">
            <button class="detail-apply-btn" onclick="applyJob('${job.id}')"><i class="fa-solid fa-paper-plane"></i> Ứng tuyển ngay</button>
            <button id="saveBtn" class="detail-save-btn" onclick="toggleSave('${job.id}')"><i class="fa-regular fa-heart"></i> Lưu tin</button>
          </div>`}
        </section>

        <aside class="detail-notice"><i class="fa-solid fa-circle-info"></i><span>Tin đăng được cung cấp chủ động bởi <strong>Nhà tuyển dụng.</strong></span></aside>

        <section class="detail-card detail-section animate-fade-up delay-1">
          <h2 class="detail-section-title">Tổng quan</h2>
          <div class="detail-tag-row"><strong>Yêu cầu:</strong><div class="detail-tags">${job.experience ? `<span>${escapeHtml(job.experience)}</span>` : "<span>Chưa cập nhật</span>"}</div></div>
          <div class="detail-tag-row"><strong>Chuyên môn:</strong><div class="detail-tags"><span>${escapeHtml(job.category || "Chưa phân loại")}</span></div></div>
          <div class="detail-overview-bottom"></div>
        </section>

        <section class="detail-card detail-section animate-fade-up delay-1">
          <h2 class="detail-section-title">Mô tả công việc</h2>
          <div class="detail-copy">${escapeHtml(job.description || "").replace(/\r?\n/g, "<br>")}</div>
        </section>

        <section class="detail-card detail-section">
          <h2 class="detail-section-title">Yêu cầu ứng viên</h2>
          <div class="detail-copy">${escapeHtml(job.requirements || "").replace(/\r?\n/g, "<br>")}</div>
        </section>

        ${job.benefits ? `<section class="detail-card detail-section"><h2 class="detail-section-title">Quyền lợi ứng viên</h2><div class="detail-copy">${escapeHtml(job.benefits).replace(/\r?\n/g, "<br>")}</div></section>` : ""}
      `;

        // Kiểm tra trạng thái lưu
        await window.updateSaveButton(jobId);
      });

      window.updateSaveButton = async function(jobId) {
        const user = window.Auth.getCurrentUser();
        const saveBtn = document.getElementById("saveBtn");
        if (!user || user.role !== "candidate") {
          if (saveBtn) saveBtn.style.display = "none";
          return;
        }

        const isSaved = await window.DB.isJobSaved(user.id, jobId);
        if (isSaved) {
          saveBtn.classList.add("btn-saved");
          saveBtn.innerHTML = '<i class="fa-solid fa-heart"></i> Đã lưu';
        } else {
          saveBtn.classList.remove("btn-saved");
          saveBtn.innerHTML =
            '<i class="fa-regular fa-heart"></i> Lưu tin';
        }
      }

      window.toggleSave = async function(jobId) {
        const user = window.Auth.getCurrentUser();
        if (!user) {
          Toast.warning("Vui lòng đăng nhập để lưu công việc!");
          return;
        }
        if (user.role !== "candidate") {
          Toast.warning("Chỉ ứng viên mới có thể lưu công việc!");
          return;
        }

        const isSaved = await window.DB.toggleSaveJob(user.id, jobId);
        await window.updateSaveButton(jobId);

        if (isSaved) {
          Toast.success("Đã lưu công việc thành công!");
        } else {
          Toast.info("Đã bỏ lưu công việc");
        }
      }

      window.applyJob = function(id) {
        const user = window.Auth.getCurrentUser();
        if (!user) {
          Toast.warning("Vui lòng đăng nhập để ứng tuyển!");
          setTimeout(() => (location.href = "auth.html"), 2000);
          return;
        }
        if (user.role !== "candidate") {
          Toast.error("Chỉ ứng viên mới có thể ứng tuyển!");
          return;
        }
        location.href = "candidate/apply.html?jobId=" + id;
      }
    </script>
  </body>
</html>

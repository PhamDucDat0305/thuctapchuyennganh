<!doctype html>
<html lang="vi">
  <head>

    <link

    />
    <link
      rel="icon"

    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./ico/favicon-16x16.png"
    />
    <link rel="manifest" href="./ico/manifest.json" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="./ico/ms-icon-144x144.png" />
    <meta name="theme-color" content="#ffffff" />
    <title>Chi tiết công việc — JobViệt</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <style>
      .detail-container {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .job-header {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        margin-bottom: 24px;
      }
      .job-body {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      .section-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin: 24px 0 12px;
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-light);
        margin-bottom: 8px;
      }
      .apply-section {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--border-light);
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }
      .btn-saved {
        color: var(--primary) !important;
        border-color: var(--primary) !important;
        background: rgba(var(--primary-rgb), 0.1) !important;
      }
    </style>
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <div class="detail-container">
      <div id="jobDetail">
        <div class="text-center" style="padding: 100px 0">
          <i
            class="fa-solid fa-circle-notch fa-spin"
            style="font-size: 3rem; color: var(--primary)"
          ></i>
          <p style="margin-top: 16px; color: var(--text-light)">
            Đang tải thông tin công việc...
          </p>
        </div>
      </div>
    </div>

    <footer class="footer" id="footer"></footer>

    <script type="module" src="js/db.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script type="module" src="js/app.js"></script>
    <script src="js/navbar.js"></script>
    <script type="module">
      document.addEventListener("DOMContentLoaded", async () => {
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[char]);
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get("id");

        if (!jobId) {
          window.location.href = "index.html";
          return;
        }

        const job = await window.DB.getJobById(jobId);
        if (!job) {
          document.getElementById("jobDetail").innerHTML = `
          <div class="card text-center" style="padding: 60px;">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; color: var(--danger); margin-bottom: 16px;"></i>
            <h2>Không tìm thấy công việc</h2>
            <p style="color: var(--text-light); margin-bottom: 24px;">Công việc bạn đang tìm kiếm không tồn tại hoặc đã bị xóa.</p>
            <a href="index.html" class="btn btn-primary">Quay lại trang chủ</a>
          </div>
        `;
          return;
        }

        // Tăng lượt xem (chỉ tăng nếu người xem không phải chủ sở hữu tin)
        const currentUser = window.Auth.getCurrentUser();
        if (!currentUser || currentUser.id !== job.createdBy) {
          await window.DB.incrementJobViews(jobId);
        }

        document.title = `${job.title} — JobViệt`;

        document.getElementById("jobDetail").innerHTML = `
        <div class="job-header animate-fade-up">
          <h1 style="font-size: 2rem; margin-bottom: 12px; color: var(--text);">${escapeHtml(job.title)}</h1>
          <div style="font-size: 1.2rem; color: var(--primary); font-weight: 600; margin-bottom: 20px;">${escapeHtml(job.companyName)}</div>
          <div class="grid grid-3">
            <div class="meta-item"><i class="fa-solid fa-location-dot text-danger"></i> ${escapeHtml(job.location)}</div>
            <div class="meta-item"><i class="fa-solid fa-money-bill-wave text-success"></i> ${escapeHtml(job.salary)}</div>
            <div class="meta-item"><i class="fa-solid fa-clock text-info"></i> ${job.type === "full-time" ? "Toàn thời gian" : "Bán thời gian"}</div>
          </div>
        </div>

        <div class="job-body animate-fade-up delay-1">
          <div class="section-title"><i class="fa-solid fa-file-lines"></i> Mô tả công việc</div>
          <p style="line-height: 1.8; color: var(--text); white-space: pre-line;">${escapeHtml(job.description)}</p>

          <div class="section-title"><i class="fa-solid fa-list-check"></i> Yêu cầu ứng viên</div>
          <p style="line-height: 1.8; color: var(--text); white-space: pre-line;">${escapeHtml(job.requirements)}</p>

          <div class="section-title"><i class="fa-solid fa-gift"></i> Quyền lợi</div>
          <p style="line-height: 1.8; color: var(--text); white-space: pre-line;">${escapeHtml(job.benefits)}</p>

          <div class="apply-section">
            <button id="saveBtn" class="btn btn-large btn-outline" onclick="toggleSave('${job.id}')">
              <i class="fa-regular fa-bookmark"></i> Lưu công việc
            </button>
            <button class="btn btn-large btn-primary" onclick="applyJob('${job.id}')">
              <i class="fa-solid fa-paper-plane"></i> Ứng tuyển ngay
            </button>
          </div>
        </div>
      `;

        // Kiểm tra trạng thái lưu
        await window.updateSaveButton(jobId);
      });

      window.updateSaveButton = async function(jobId) {
        const user = window.Auth.getCurrentUser();
        const saveBtn = document.getElementById("saveBtn");
        if (!user || user.role !== "candidate") {
          if (saveBtn) saveBtn.style.display = "none";
          return;
        }

        const isSaved = await window.DB.isJobSaved(user.id, jobId);
        if (isSaved) {
          saveBtn.classList.add("btn-saved");
          saveBtn.innerHTML = '<i class="fa-solid fa-bookmark"></i> Đã lưu';
        } else {
          saveBtn.classList.remove("btn-saved");
          saveBtn.innerHTML =
            '<i class="fa-regular fa-bookmark"></i> Lưu công việc';
        }
      }

      window.toggleSave = async function(jobId) {
        const user = window.Auth.getCurrentUser();
        if (!user) {
          Toast.warning("Vui lòng đăng nhập để lưu công việc!");
          return;
        }
        if (user.role !== "candidate") {
          Toast.warning("Chỉ ứng viên mới có thể lưu công việc!");
          return;
        }

        const isSaved = await window.DB.toggleSaveJob(user.id, jobId);
        await window.updateSaveButton(jobId);

        if (isSaved) {
          Toast.success("Đã lưu công việc thành công!");
        } else {
          Toast.info("Đã bỏ lưu công việc");
        }
      }

      window.applyJob = function(id) {
        const user = window.Auth.getCurrentUser();
        if (!user) {
          Toast.warning("Vui lòng đăng nhập để ứng tuyển!");
          setTimeout(() => (location.href = "auth.html"), 2000);
          return;
        }
        if (user.role !== "candidate") {
          Toast.error("Chỉ ứng viên mới có thể ứng tuyển!");
          return;
        }
        location.href = "candidate/apply.html?jobId=" + id;
      }
    </script>
  </body>
</html>

    <title>Ứng tuyển — JobViệt</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />
    <link rel="stylesheet" href="../css/pages/candidate.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <section class="section">
      <div class="container container-narrow">
        <a href="javascript:history.back()" class="btn btn-ghost mb-2"
          >← Quay lại</a
        >
        <div class="card card-large animate-fade-up" id="applyCard"></div>
      </div>
    </section>
    <footer class="footer" id="footer"></footer>
    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      document.addEventListener("DOMContentLoaded", async () => {
        const user = window.Auth.requireAuth(["candidate"]);
        if (!user) return;
        window.App.renderFooter();
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[char]);
        const formatDeadline = (value) => value
          ? new Date(value).toLocaleString("vi-VN", { dateStyle: "long", timeStyle: "short" })
          : "Không giới hạn";
        const displayValue = (value) => escapeHtml(value || "Chưa cập nhật");

        const card = document.getElementById("applyCard");
        const jobId = new URLSearchParams(location.search).get("jobId");
        card.innerHTML = '<div class="text-center" style="padding:24px">Đang tải thông tin ứng tuyển...</div>';

        try {
          const job = await window.DB.getJobById(jobId);
          if (!job) {
            card.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-circle-xmark"></i></div><h3>Không tìm thấy việc làm</h3></div>';
            return;
          }
          const hasApplied = await window.DB.hasApplied(jobId, user.id);
          if (hasApplied) {
            card.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-circle-check"></i></div><h3>Bạn đã ứng tuyển việc này</h3><p>Theo dõi trạng thái tại trang "Việc đã ứng tuyển"</p><a href="my-applications.html" class="btn btn-primary mt-2">Xem danh sách</a></div>';
            return;
          }

          const company = job.companyId ? await window.DB.getCompanyById(job.companyId) : null;
          const jobType = job.type === "full-time" ? "Toàn thời gian" : job.type === "part-time" ? "Bán thời gian" : job.type;

          card.innerHTML = `
          <div class="apply-company-summary">
            <div class="apply-company-logo">${company?.logo ? `<img src="${escapeHtml(company.logo)}" alt="Logo ${escapeHtml(company.name)}">` : '<i class="fa-solid fa-building"></i>'}</div>
            <div class="apply-company-info">
              <h2>${window.App.profileLink("company", job.companyId, company?.name || job.companyName)}</h2>
              <p>${displayValue(company?.industry)}${company?.size ? ` · ${escapeHtml(company.size)}` : ""}</p>
              <p><i class="fa-solid fa-location-dot"></i> ${displayValue(company?.location)}</p>
              ${company?.website ? `<a href="${escapeHtml(company.website)}" target="_blank" rel="noopener noreferrer">${escapeHtml(company.website)}</a>` : ""}
              ${company?.description ? `<p class="apply-company-description">${escapeHtml(company.description)}</p>` : ""}
            </div>
            <div class="apply-deadline"><span>Hạn ứng tuyển</span><strong>${escapeHtml(formatDeadline(job.expiresAt))}</strong></div>
          </div>
          <header class="apply-job-heading">
            <span class="badge badge-primary">${displayValue(job.category)}</span>
            <h1>${escapeHtml(job.title)}</h1>
          </header>
          <section class="apply-job-section">
            <h2><i class="fa-solid fa-list-check"></i> Tổng quan</h2>
            <div class="apply-overview-grid">
              <div><span>Ngành nghề</span><strong>${displayValue(job.category)}</strong></div>
              <div><span>Kinh nghiệm</span><strong>${displayValue(job.experience)}</strong></div>
            </div>
          </section>
          <section class="apply-job-section">
            <h2><i class="fa-solid fa-file-lines"></i> Mô tả công việc</h2>
            <p class="apply-preserve-lines">${displayValue(job.description)}</p>
          </section>
          <section class="apply-job-section">
            <h2><i class="fa-solid fa-user-check"></i> Yêu cầu ứng viên</h2>
            <p class="apply-preserve-lines">${displayValue(job.requirements)}</p>
          </section>
          <section class="apply-job-section">
            <h2><i class="fa-solid fa-money-bill-wave"></i> Thu nhập</h2>
            <p>${displayValue(job.salary)}</p>
          </section>
          <section class="apply-job-section">
            <h2><i class="fa-solid fa-gift"></i> Quyền lợi ứng viên</h2>
            <p class="apply-preserve-lines">${displayValue(job.benefits)}</p>
          </section>
          <section class="apply-job-section">
            <h2><i class="fa-solid fa-location-dot"></i> Địa điểm và thời gian</h2>
            <div class="apply-overview-grid">
              <div><span>Địa điểm</span><strong>${displayValue(job.location)}</strong></div>
              <div><span>Hình thức làm việc</span><strong>${displayValue(jobType)}</strong></div>
            </div>
          </section>
          <section class="apply-job-section apply-form-section">
            <h2><i class="fa-solid fa-envelope-open-text"></i> Gửi ứng tuyển</h2>
            <form id="applicationForm">
              <div class="form-group">
                <label class="form-label" for="fullName">Họ và tên</label>
                <input class="form-input" id="fullName" value="${escapeHtml(user.fullName)}" readonly required>
              </div>
              <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-input" id="email" value="${escapeHtml(user.email)}" readonly required>
              </div>
              <div class="form-group">
                <label class="form-label" for="cv">Nội dung giới thiệu / CV (văn bản)</label>
                <textarea class="form-textarea" id="cv" rows="6" required placeholder="Mô tả kinh nghiệm, kỹ năng, lý do bạn phù hợp với vị trí này..."></textarea>
                <p class="form-hint">Nhập nội dung dạng văn bản; hiện chưa hỗ trợ tải lên tệp CV.</p>
              </div>
              <button type="submit" class="btn btn-primary btn-large w-100"><i class="fa-solid fa-paper-plane"></i> Gửi ứng tuyển</button>
            </form>
          </section>`;

        window.submitApplication = async function(e) {
          e.preventDefault();
          const btn = e.target.querySelector('button[type="submit"]');
          btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang gửi...';
          btn.disabled = true;

          try {
            await window.DB.createApplication({
              jobId,
              cv: document.getElementById("cv").value.trim(),
            });
            Toast.success("🎉 Ứng tuyển thành công! Nhà tuyển dụng sẽ xem hồ sơ của bạn.");
            setTimeout(() => { location.href = "my-applications.html"; }, 1500);
          } catch (error) {
            Toast.error("Không thể gửi ứng tuyển: " + error.message);
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Gửi ứng tuyển';
            btn.disabled = false;
          }
        }
        card.querySelector("#applicationForm").addEventListener("submit", window.submitApplication);
        } catch (error) {
          console.error("Không tải được form ứng tuyển:", error);
          card.innerHTML = `<div class="empty-state"><h3>Không tải được thông tin ứng tuyển</h3><p>${escapeHtml(error.message)}</p><p>Kiểm tra backend, session đăng nhập và bảng applications trong SQL Server.</p></div>`;
        }
      });
    </script>
  </body>
</html>

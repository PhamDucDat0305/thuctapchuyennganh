    <title>Ứng tuyển — JobViệt</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />
    <link rel="stylesheet" href="../css/pages/candidate.css" />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <section class="section">
      <div class="container container-narrow">
        <a href="javascript:history.back()" class="btn btn-ghost mb-2"
          >← Quay lại</a
        >
        <div class="card card-large animate-fade-up" id="applyCard"></div>
      </div>
    </section>
    <footer class="footer" id="footer"></footer>
    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      document.addEventListener("DOMContentLoaded", async () => {
        const user = window.Auth.requireAuth(["candidate"]);
        if (!user) return;
        window.App.renderFooter();
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[char]);

        const card = document.getElementById("applyCard");
        const jobId = new URLSearchParams(location.search).get("jobId");
        card.innerHTML = '<div class="text-center" style="padding:24px">Đang tải thông tin ứng tuyển...</div>';

        try {
          const job = await window.DB.getJobById(jobId);
          if (!job) {
            card.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-circle-xmark"></i></div><h3>Không tìm thấy việc làm</h3></div>';
            return;
          }
          const hasApplied = await window.DB.hasApplied(jobId, user.id);
          if (hasApplied) {
            card.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-circle-check"></i></div><h3>Bạn đã ứng tuyển việc này</h3><p>Theo dõi trạng thái tại trang "Việc đã ứng tuyển"</p><a href="my-applications.html" class="btn btn-primary mt-2">Xem danh sách</a></div>';
            return;
          }

          card.innerHTML = `
          <div class="mb-3">
            <h2><i class="fa-solid fa-envelope-open-text"></i> Ứng tuyển</h2>
            <p class="cv-meta">${escapeHtml(job.title)} — ${escapeHtml(job.companyName)}</p>
          </div>
          <form id="applicationForm">
            <div class="form-group">
              <label class="form-label">Họ và tên</label>
              <input class="form-input" id="fullName" value="${escapeHtml(user.fullName)}" readonly required>
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="email" value="${escapeHtml(user.email)}" readonly required>
            </div>
            <div class="form-group">
              <label class="form-label">Nội dung giới thiệu / CV (văn bản)</label>
              <textarea class="form-textarea" id="cv" rows="6" required placeholder="Mô tả kinh nghiệm, kỹ năng, lý do bạn phù hợp với vị trí này..."></textarea>
              <p class="form-hint">Nhập nội dung dạng văn bản; hiện chưa hỗ trợ tải lên tệp CV.</p>
            </div>
            <button type="submit" class="btn btn-primary btn-large w-100"><i class="fa-solid fa-paper-plane"></i> Gửi ứng tuyển</button>
          </form>
        `;

        window.submitApplication = async function(e) {
          e.preventDefault();
          const btn = e.target.querySelector('button[type="submit"]');
          btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang gửi...';
          btn.disabled = true;

          try {
            await window.DB.createApplication({
              jobId,
              cv: document.getElementById("cv").value.trim(),
            });
            Toast.success("🎉 Ứng tuyển thành công! Nhà tuyển dụng sẽ xem hồ sơ của bạn.");
            setTimeout(() => { location.href = "my-applications.html"; }, 1500);
          } catch (error) {
            Toast.error("Không thể gửi ứng tuyển: " + error.message);
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Gửi ứng tuyển';
            btn.disabled = false;
          }
        }
        card.querySelector("#applicationForm").addEventListener("submit", window.submitApplication);
        } catch (error) {
          console.error("Không tải được form ứng tuyển:", error);
          card.innerHTML = `<div class="empty-state"><h3>Không tải được thông tin ứng tuyển</h3><p>${escapeHtml(error.message)}</p><p>Kiểm tra backend, session đăng nhập và bảng applications trong SQL Server.</p></div>`;
        }
      });
    </script>
  </body>
</html>

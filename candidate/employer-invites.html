    <title>Lời mời kết nối — JobViệt</title>
    <link rel="stylesheet" href="../css/styles.css" />

    />

  <body>
    <div id="navbar-placeholder"></div>
    <div class="layout-sidebar">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content-area">
        <div class="content-header">
          <h1>🤝 Nhà tuyển dụng muốn kết nối</h1>
          <p>
            Danh sách các lời mời phỏng vấn và ứng tuyển từ phía doanh nghiệp
          </p>
        </div>

        <div class="table-wrapper animate-fade-up">
          <table class="table">
            <thead>
              <tr>
                <th>Công ty</th>
                <th>Vị trí đề xuất</th>
                <th>Lời nhắn</th>
                <th>Ngày gửi</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="inviteList">
              <tr><td colspan="6" class="text-center">Đang tải lời mời...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
    <script type="module" src="../js/db.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script src="../js/navbar.js"></script>
    <script type="module">
      const user = window.Auth.requireAuth(["candidate"]);
      if (!user) throw "redirect";
      window.App.renderSidebar("candidate", "invites");
      BadgeNotifier.markSeenInvites(user.id);

      const inviteList = document.getElementById("inviteList");
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[char]);

      function formatDate(value) {
        return value ? new Date(value).toLocaleDateString("vi-VN") : "—";
      }

      async function renderInvites() {
        inviteList.innerHTML = '<tr><td colspan="6" class="text-center">Đang tải lời mời...</td></tr>';
        try {
          const invites = await window.DB.getInvitesByCandidate(user.id);
          if (!invites.length) {
            inviteList.innerHTML = '<tr><td colspan="6" class="text-center">Bạn chưa có lời mời kết nối nào.</td></tr>';
            return;
          }
          inviteList.innerHTML = invites.map((invite) => {
            const status = {
              pending: ['Chờ phản hồi', 'badge-warning'],
              accepted: ['Đã đồng ý', 'badge-success'],
              rejected: ['Đã từ chối', 'badge-neutral'],
            }[invite.status] || ['Không xác định', 'badge-neutral'];
            const actions = invite.status === 'pending'
              ? `<button class="btn btn-sm btn-primary" onclick="respondToInvite(${Number(invite.id)}, 'accepted')">Chấp nhận</button>
                 <button class="btn btn-sm btn-light" onclick="respondToInvite(${Number(invite.id)}, 'rejected')">Từ chối</button>`
              : '<button class="btn btn-sm btn-light" disabled>Đã xử lý</button>';
            return `<tr>
              <td><strong>${escapeHtml(invite.companyName || 'Nhà tuyển dụng')}</strong></td>
              <td>${escapeHtml(invite.jobTitle || 'Lời mời kết nối')}</td>
              <td>${escapeHtml(invite.message || '—')}</td>
              <td>${formatDate(invite.createdAt)}</td>
              <td><span class="badge ${status[1]}">${status[0]}</span></td>
              <td>${actions}</td>
            </tr>`;
          }).join('');
        } catch (error) {
          console.error('Không tải được lời mời:', error);
          inviteList.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Không tải được lời mời. Hãy kiểm tra backend và migration SQL.</td></tr>';
        }
      }

      window.respondToInvite = async function(inviteId, status) {
        try {
          await window.DB.updateInviteStatus(inviteId, status);
          Toast.success(status === 'accepted' ? 'Đã chấp nhận lời mời.' : 'Đã từ chối lời mời.');
          await renderInvites();
        } catch (error) {
          console.error('Không cập nhật được lời mời:', error);
          Toast.error(error.message || 'Không cập nhật được lời mời.');
        }
      };

      renderInvites();
    </script>
  </body>
